{% extends "users/base.html" %}
{% block title %}Doctor Dashboard{% endblock %}

{% block content %}
<div class="text-center mb-4 text-white">
    <h2><i class="bi bi-person-badge-fill"></i> Bienvenue Docteur {{ user.username }}</h2>
    <p class="lead">Voici votre tableau de bord</p>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow p-3 mb-4 bg-light bg-opacity-75">
            <h5><i class="bi bi-calendar-check-fill"></i> Appointments</h5>
            <p>Consultez les rendez-vous</p>
            <a href="{% url 'doctor_appointments' %}" class="btn btn-primary">Voir les rendez-vous</a>
        </div>
    </div>
</div>
{% endblock %}

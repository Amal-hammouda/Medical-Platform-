{% extends "users/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 bg-light bg-opacity-75">
            <h3 class="mb-4 text-center"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-door-open"></i> Login</button>
            </form>
            <p class="mt-3 text-center text-dark">Don't have an account? <a href="{% url 'signup' %}">Signup</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% extends "users/base.html" %}
{% block title %}Signup{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 bg-light bg-opacity-75">
            <h3 class="mb-4 text-center"><i class="bi bi-person-plus-fill"></i> Signup</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle"></i> Register</button>
            </form>
            <p class="mt-3 text-center text-dark">Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}

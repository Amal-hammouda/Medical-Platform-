{% extends "users/base.html" %}
{% block title %}Patient Dashboard{% endblock %}

{% block content %}
<div class="text-center mb-4 text-white">
    <h2><i class="bi bi-person-fill"></i> Bienvenue {{ user.username }}</h2>
    <p class="lead">Voici votre tableau de bord</p>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow p-3 mb-4 bg-light bg-opacity-75">
            <h5><i class="bi bi-calendar-plus-fill"></i> Book Appointment</h5>
            <p>Réservez un rendez-vous avec votre médecin</p>
            <a href="{% url 'book_appointment' %}" class="btn btn-primary">Réserver maintenant</a>
        </div>
    </div>
</div>
{% endblock %}

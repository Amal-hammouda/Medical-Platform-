{% extends "users/base.html" %}
{% block title %}Book Appointment{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 bg-light bg-opacity-75">
            <h3 class="mb-4 text-center"><i class="bi bi-calendar-plus-fill"></i> Book Appointment</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-circle"></i> Book</button>
            </form>
        </div>
    </div>
</div>
<script>
  flatpickr(".datepicker", { dateFormat: "Y-m-d" });
</script>
{% endblock %}
